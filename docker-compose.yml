services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: betu
      POSTGRES_PASSWORD: betu_dev_password
      POSTGRES_DB: betu
    ports:
      - "5432:5432"
    volumes:
      - betu_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betu"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  betu_db_data:
